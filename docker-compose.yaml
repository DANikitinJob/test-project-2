
services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel
  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/laravel
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - env/mysql.env
    volumes:
      - ./src:/var/www/laravel
  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - mysql # Указываем, что phpMyAdmin зависит от MySQL
    environment:
      PMA_HOST: mysql # Имя сервиса MySQL (должно совпадать с названием в docker-compose)
      PMA_USER: root # Тот же пользователь, что в MySQL
      PMA_PASSWORD: "12345" # Пароль MySQL
    ports:
      - "8080:80" # Открываем phpMyAdmin на порту 8080
  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
    volumes:
      - ./src:/var/www/laravel